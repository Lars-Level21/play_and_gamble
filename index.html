<style>
  :root{
    /* Golfclub Bostalsee – Navy #00376B / Limette #90AE25 auf Weiß */
    --navy:#00376B; --navy-dark:#022A50; --navy-soft:#E2E9F1;
    --lime:#90AE25; --lime-dark:#6E8912; --lime-soft:#EDF2DA;
    --loss:#B0472F;
    --paper:#F1F4EE; --paper-2:#E7ECE3; --panel:#FFFFFF;
    --ink:#132A41; --ink-soft:#5B6B79; --line:#D3DAD4;
    /* Aliase auf Marken-Töne, damit bestehende Regeln greifen */
    --turf:var(--navy); --turf-dark:var(--navy-dark); --turf-soft:var(--lime-soft);
    --flag:var(--loss); --flag-dark:#8F3624;
    --sand:#C6CDBF; --gold:var(--lime);
    --agg:var(--navy); --skin:var(--navy-dark);
    --radius:14px; --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 20px rgba(10,30,55,.10);
    --tap:52px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--navy-dark)}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink); line-height:1.4;
    display:flex; justify-content:center;
  }
  .app{
    width:100%; max-width:480px; min-height:100dvh;
    background:var(--paper); position:relative;
    display:flex; flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,.35);
  }
  /* ---------- header ---------- */
  header{
    background:var(--navy-dark); color:#F4F7FB;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    position:sticky; top:0; z-index:20;
    border-bottom:3px solid var(--lime);
  }
  .hrow{display:flex; align-items:center; gap:10px}
  .back{
    background:transparent; border:0; color:#AFC3D8; font-size:15px;
    padding:8px 6px 8px 0; cursor:pointer; min-height:var(--tap);
    display:flex; align-items:center; gap:6px;
  }
  .back:disabled{opacity:0;pointer-events:none}
  .brand-logo{
    margin-left:auto; height:42px; width:42px; border-radius:50%;
    background:#fff; padding:2px; box-shadow:0 2px 8px rgba(0,0,0,.25); display:block;
  }
  .htitle{font-size:20px; font-weight:800; letter-spacing:-.01em; margin:6px 0 0; color:#fff}
  .hsub{font-size:12.5px; color:#AFC9DE; margin-top:2px}
  /* mini leaderboard in header */
  .mini{display:flex; gap:6px; margin-top:12px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
  .mini::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; background:#0d426f; border:1px solid #1c5688; color:#EAF2F9;
    border-radius:10px; padding:7px 10px; min-width:76px;
  }
  .chip.lead{background:var(--lime); border-color:var(--lime-dark); color:#1c2705}
  .chip .cn{font-size:11px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:80px}
  .chip .cp{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-variant-numeric:tabular-nums; font-size:19px; font-weight:700; letter-spacing:-.02em}
  /* ---------- main ---------- */
  main{flex:1; padding:18px 16px 120px; display:flex; flex-direction:column; gap:14px}
  .eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); font-weight:700}
  h2.sec{font-size:15px; margin:2px 0 2px; font-weight:800}
  p.lead{font-size:14px; color:var(--ink-soft); margin:0}
  /* game cards */
  .gcard{
    text-align:left; width:100%; border:0; cursor:pointer;
    background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:16px; display:flex; gap:14px; align-items:center;
    border-left:6px solid var(--turf);
  }
  .gcard:active{transform:translateY(1px)}
  .gicon{
    width:46px;height:46px;flex:0 0 46px;border-radius:12px;display:grid;place-items:center;
    font-size:22px; background:var(--navy-soft);
  }
  .gcard.aggregat{border-left-color:#2F9E63}
  .gcard.aggregat .gicon{background:#E3F1EA}
  .gcard.bbb{border-left-color:#C8433A}
  .gcard.bbb .gicon{background:#F7E3E0}
  .gcard.skins{border-left-color:#C6982C}
  .gcard.skins .gicon{background:#F5ECD5}
  .gcard.vegas{border-left-color:#33383D}
  .gcard.vegas .gicon{background:#E5E7E9}
  .gcard.wolf{border-left-color:#6B7787}
  .gcard.wolf .gicon{background:#E7EAEE}
  .gcard .gt{font-weight:800; font-size:16px}
  .gcard .gd{font-size:12.5px; color:var(--ink-soft); margin-top:2px}
  /* panels */
  .panel{background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px}
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  label.fl{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; letter-spacing:.02em}
  input[type=text],input[type=number]{
    width:100%; font-size:16px; padding:13px 12px; border:1.5px solid var(--line);
    border-radius:10px; background:var(--paper-2); color:var(--ink); font-family:inherit;
  }
  input:focus{outline:none; border-color:var(--turf); background:#fff}
  input[type=number]{font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums; text-align:center}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
  /* Score-Stepper (Vegas/Aggregat/Skins) */
  .scorerow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
  .scorerow .vn{font-size:15px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .scstep{display:flex; align-items:center; gap:8px; flex:0 0 auto}
  .scstep button{
    width:48px; height:48px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--paper-2); font-size:26px; font-weight:800; color:var(--navy);
    cursor:pointer; line-height:1; display:grid; place-items:center;
  }
  .scstep button:active{transform:translateY(1px); background:var(--navy-soft)}
  .scval{
    font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums;
    font-size:26px; font-weight:800; min-width:42px; text-align:center; color:var(--ink);
  }
  .scval.empty{color:var(--ink-soft); font-weight:600}
  /* Par-Stepper im Loch-Kopf */
  .parstep{display:flex; align-items:center; gap:8px}
  .parstep .parlbl{font-size:12px; color:var(--ink-soft); font-weight:800; letter-spacing:.04em; text-transform:uppercase}
  .parstep button{
    width:42px; height:42px; border-radius:11px; border:1.5px solid var(--line);
    background:var(--paper-2); font-size:23px; font-weight:800; color:var(--navy); cursor:pointer; line-height:1;
    display:grid; place-items:center;
  }
  .parstep button:active{transform:translateY(1px); background:var(--navy-soft)}
  .parstep .parval{font-family:ui-monospace,monospace; font-size:22px; font-weight:800; min-width:26px; text-align:center; color:var(--navy)}
  /* stepper */
  .stepper{display:flex; align-items:center; gap:12px}
  .stepper button{
    width:var(--tap); height:var(--tap); border-radius:12px; border:1.5px solid var(--line);
    background:var(--paper-2); font-size:26px; font-weight:700; color:var(--turf-dark); cursor:pointer;
  }
  .stepper .val{
    font-family:ui-monospace,monospace; font-size:32px; font-weight:800; min-width:56px; text-align:center;
    font-variant-numeric:tabular-nums;
  }
  /* segmented toggle */
  .seg{display:flex; border:1.5px solid var(--line); border-radius:10px; overflow:hidden}
  .seg button{
    flex:1; border:0; background:var(--paper-2); padding:12px 8px; font-size:14px; font-weight:700;
    color:var(--ink-soft); cursor:pointer; min-height:var(--tap);
  }
  .seg button.on{background:var(--turf); color:#fff}
  /* player name rows */
  .prow{display:flex; align-items:center; gap:10px; margin-bottom:10px}
  .pnum{
    width:30px;height:30px;flex:0 0 30px;border-radius:50%; background:var(--turf); color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:13px;
    font-family:ui-monospace,monospace;
  }
  /* choice grid (winner pick, partner pick) */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .pick{
    border:1.5px solid var(--line); background:var(--paper-2); border-radius:12px;
    padding:14px 10px; font-size:15px; font-weight:700; color:var(--ink); cursor:pointer;
    min-height:var(--tap); text-align:center; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .pick.on{background:var(--navy); color:#fff; border-color:var(--navy-dark)}
  .pick.on.flag{background:var(--lime); color:#1c2705; border-color:var(--lime-dark)}
  .pick.on.gold{background:var(--lime); color:#1c2705; border-color:var(--lime-dark)}
  .pick.wide{grid-column:1/-1}
  .pick.muted{color:var(--ink-soft); font-weight:600}
  /* hole label */
  .holebar{display:flex; align-items:center; justify-content:space-between; margin-bottom:2px}
  .holetag{font-family:ui-monospace,monospace; font-weight:800; font-size:15px; letter-spacing:.04em}
  .par{font-size:12px; color:var(--ink-soft)}
  .bbb-line{margin-bottom:16px}
  .bbb-line .cap{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .bbb-line .cap b{font-size:15px}
  .bbb-line .cap span{font-size:11.5px;color:var(--ink-soft)}
  /* vegas score row */
  .vteam{margin-bottom:14px}
  .vteam h4{margin:0 0 8px; font-size:13px; letter-spacing:.04em}
  .vscore{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  .vscore .vn{flex:1; font-size:14px; font-weight:600}
  .vscore input{width:74px}
  .vresult{
    font-family:ui-monospace,monospace; font-variant-numeric:tabular-nums;
    background:var(--turf-soft); border-radius:10px; padding:10px 12px; font-size:13.5px; margin-top:6px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .vresult .big{font-size:20px; font-weight:800}
  .flip-note{color:var(--flag-dark); font-weight:700}
  /* summary table */
  .board{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
  .board th,.board td{padding:11px 8px; text-align:left; border-bottom:1px solid var(--line)}
  .board th{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft)}
  .board td.num{font-family:ui-monospace,monospace; text-align:right; font-weight:700}
  .board tr.win td{color:var(--turf-dark)}
  .board td .rk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--paper);font-size:11px;font-weight:800;margin-right:8px;font-family:ui-monospace,monospace}
  .board tr:first-child td .rk{background:var(--lime);color:#1c2705}
  .settle{margin-top:10px; font-size:14px}
  .settle div{padding:8px 0; border-bottom:1px dashed var(--line); display:flex; justify-content:space-between}
  .settle .amt{font-family:ui-monospace,monospace; font-weight:700}
  /* bottom action bar */
  .bar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    display:flex; justify-content:center; pointer-events:none;
  }
  .bar-inner{
    width:100%; max-width:480px; background:linear-gradient(to top,var(--paper) 70%,rgba(236,229,210,0));
    padding:12px 16px calc(env(safe-area-inset-bottom) + 14px); pointer-events:auto;
    display:flex; gap:10px; align-items:center;
  }
  .btn{
    border:0; border-radius:12px; font-size:16px; font-weight:800; cursor:pointer;
    min-height:56px; padding:0 18px; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn.primary{background:var(--navy); color:#fff; flex:1; box-shadow:0 4px 14px rgba(0,55,107,.30)}
  .btn.primary:disabled{background:var(--sand); box-shadow:none; color:#6b7a72}
  .btn.ghost{background:var(--paper-2); color:var(--navy); border:1.5px solid var(--line); flex:0 0 auto; min-width:56px}
  .btn.turf{background:var(--lime); color:#1c2705; flex:1}
  .btn:active{transform:translateY(1px)}
  .holenav{display:flex; align-items:center; gap:8px}
  .holenav .cur{font-family:ui-monospace,monospace; font-weight:800; font-size:15px; min-width:70px; text-align:center; color:var(--navy)}
  /* resume banner */
  .resume{
    background:var(--navy); color:#EAF2F9; border-radius:var(--radius); padding:14px 16px;
    display:flex; align-items:center; gap:12px; box-shadow:var(--shadow);
  }
  .resume .rt{flex:1; font-size:13.5px}
  .resume button{border:0; border-radius:10px; padding:10px 14px; font-weight:800; font-size:13px; cursor:pointer}
  .resume .go{background:var(--lime); color:#1c2705}
  .resume .x{background:transparent; color:#AFC3D8}
  .hint{font-size:12px; color:var(--ink-soft); margin-top:4px}
  .divider{height:1px; background:var(--line); margin:4px 0}
  .small-cfg{display:grid; grid-template-columns:1fr auto; gap:8px 12px; align-items:center; font-size:13.5px}
  .small-cfg input{width:70px; padding:9px}
  .badge{display:inline-block;background:var(--navy-soft);color:var(--navy);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:800;letter-spacing:.03em}
  .tag-wolf{background:var(--lime-soft);color:var(--lime-dark)}
  @media (max-width:360px){ .grid{grid-template-columns:1fr} }
</style>

<body>
<div class="app" id="app"></div>

<script>
"use strict";
/* ============================ Storage (Fallback-sicher) ============================ */
const store = (() => {
  let mem = {}, ok = false;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ok = true; } catch(e){}
  return {
    ok,
    get(k){ try { const v = ok ? localStorage.getItem(k) : (k in mem ? JSON.stringify(mem[k]) : null); return v==null?null:JSON.parse(v); } catch(e){ return null; } },
    set(k,v){ try { ok ? localStorage.setItem(k, JSON.stringify(v)) : (mem[k]=v); } catch(e){ mem[k]=v; } },
    del(k){ try { ok ? localStorage.removeItem(k) : (delete mem[k]); } catch(e){} }
  };
})();
const SKEY = "fairwayledger:v1", NKEY = "fairwayledger:names";

/* ============================ State ============================ */
const GAMES = {
  bbb:   {name:"Bingo Bango Bongo", icon:"🎯", cls:"bbb",   min:2, max:8, defP:4,
          desc:"3 Punkte pro Loch: erster aufs Grün, näher zur Fahne, erster eingelocht."},
  wolf:  {name:"Wolf",             icon:"🐺", cls:"wolf",  min:3, max:5, defP:4,
          desc:"Rotierender Wolf wählt Partner oder spielt allein gegen den Rest."},
  vegas: {name:"Vegas",            icon:"🎲", cls:"vegas", min:4, max:4, defP:4,
          desc:"2 Teams, Schläge werden zur Zahl kombiniert – Differenz zählt."},
  aggregat:{name:"Aggregat",       icon:"➕", cls:"aggregat", min:4, max:4, defP:4,
          desc:"2 Teams: bester Einzelscore und niedrigere Team-Summe geben je einen Punkt."},
  skins: {name:"Skins",            icon:"🪙", cls:"skins", min:2, max:8, defP:4,
          desc:"Niedrigster Score gewinnt das Loch. Gleichstand → der Skin wandert weiter."}
};
let S = null;

function freshState(game){
  const g = GAMES[game];
  const names = store.get(NKEY) || [];
  const players = Array.from({length:g.defP}, (_,i)=>({name: names[i] || ""}));
  const base = {
    screen:"setup", game, players, holes:18, currentHole:1, stake:0, results:{},
    cfg: defaultCfg(game)
  };
  if(game==="vegas"||game==="aggregat"){ base.teams=[0,0,1,1]; base.par=4; }
  if(game==="wolf"){ base.order=null; }
  return base;
}
function defaultCfg(game){
  if(game==="bbb")   return {pt:1};
  if(game==="wolf")  return {partnerWin:1, loneWin:null, loneLoss:1, blindMult:2, carry:false}; // loneWin null => Anzahl Gegner
  if(game==="vegas") return {flip:true, cap:9};
  if(game==="aggregat") return {birdieDouble:false};
  return {};
}

/* ============================ Boot ============================ */
function boot(){
  const saved = store.get(SKEY);
  if(saved && saved.game && saved.screen && saved.screen!=="home"){
    render(homeScreen(saved));
  } else {
    render(homeScreen(null));
  }
}
function persist(){ if(S) store.set(SKEY, S); }
function go(screen){ S.screen=screen; persist(); render(); }

/* ============================ Router ============================ */
function render(customHome){
  const app = document.getElementById("app");
  if(customHome){ app.innerHTML = customHome; wire(); return; }
  let html="";
  switch(S.screen){
    case "setup":   html=setupScreen(); break;
    case "config":  html=configScreen(); break;
    case "play":    html=playScreen(); break;
    case "summary": html=summaryScreen(); break;
    default:        html=homeScreen(null);
  }
  app.innerHTML = html;
  wire();
  const m = app.querySelector("main"); if(m) m.scrollTop=0;
}

function homeScreen(saved){
  const resume = saved ? `<div class="resume">
      <div class="rt"><b>${GAMES[saved.game].name}</b> läuft noch – Loch ${saved.currentHole} von ${saved.holes}.</div>
      <button class="go" data-resume>Weiter</button>
      <button class="x" data-clearsaved>✕</button>
    </div>` : "";
  const cards = Object.entries(GAMES).sort((a,b)=>a[1].name.localeCompare(b[1].name,"de")).map(([k,g])=>`
    <button class="gcard ${g.cls}" data-game="${k}">
      <div class="gicon">${g.icon}</div>
      <div><div class="gt">${g.name}</div><div class="gd">${g.desc}</div></div>
    </button>`).join("");
  const storeNote = store.ok ? "" : `<p class="hint">Hinweis: Dieser Browser blockiert lokalen Speicher – Spiele werden nur bis zum Neuladen gehalten. Auf der gehosteten Seite bleibt alles erhalten.</p>`;
  return `${header("Play & Gamble","Spiel wählen, Namen rein, los.")}
    <main>
      ${resume}
      <div class="eyebrow">Spielformat</div>
      ${cards}
      ${storeNote}
      <p class="hint">Kein Login, keine Server. Alles bleibt in diesem Browser.</p>
    </main>`;
}

function setupScreen(){
  const g = GAMES[S.game];
  const fixed = g.min===g.max;
  const rows = S.players.map((p,i)=>`
    <div class="prow">
      <div class="pnum">${i+1}</div>
      <input type="text" data-name="${i}" value="${escAttr(p.name)}" placeholder="Spieler ${i+1}" autocomplete="off" enterkeyhint="next">
    </div>`).join("");
  const stepper = fixed ? `<div class="badge">${g.min} Spieler (fix für ${g.name})</div>` :
    `<div class="stepper">
      <button data-pcount="-1" ${S.players.length<=g.min?"disabled":""}>–</button>
      <div class="val">${S.players.length}</div>
      <button data-pcount="1" ${S.players.length>=g.max?"disabled":""}>+</button>
      <span class="hint" style="margin-left:6px">${g.min}–${g.max} Spieler</span>
    </div>`;
  return `${header(g.name, "Wer spielt mit?", {back:"home"})}
    <main>
      <div class="panel">
        <div class="field"><label class="fl">Anzahl Spieler</label>${stepper}</div>
        <div class="divider"></div>
        <div class="field" style="margin-bottom:0">
          <label class="fl">Namen</label>
          ${rows}
        </div>
      </div>
    </main>
    ${bar(`<button class="btn primary" data-to="config">Weiter ›</button>`)}`;
}

function configScreen(){
  const g = GAMES[S.game];
  let extra = "";
  if(S.game==="bbb"){
    extra = `<div class="field"><label class="fl">Punkte je Bingo / Bango / Bongo</label>
      <div class="stepper"><button data-cfg="pt:-1" ${S.cfg.pt<=1?"disabled":""}>–</button>
      <div class="val">${S.cfg.pt}</div><button data-cfg="pt:1">+</button></div></div>`;
  }
  if(S.game==="wolf"){
    extra = `
      <div class="field"><label class="fl">Punktwerte</label>
        <div class="small-cfg">
          <span>Partner-Sieg (je Gewinner)</span><input type="number" data-cfgv="partnerWin" value="${S.cfg.partnerWin}" min="1">
          <span>Lone-Wolf-Sieg</span><input type="number" data-cfgv="loneWin" value="${S.cfg.loneWin ?? (S.players.length-1)}" min="1">
          <span>Lone-Wolf-Niederlage (je Gegner)</span><input type="number" data-cfgv="loneLoss" value="${S.cfg.loneLoss}" min="1">
          <span>Blind-Wolf-Multiplikator</span><input type="number" data-cfgv="blindMult" value="${S.cfg.blindMult}" min="1">
        </div>
        <p class="hint">Lone-Wolf-Sieg-Default = Anzahl Gegner (${S.players.length-1}). Blind verdoppelt die Lone-Werte.</p>
      </div>
      <div class="field"><label class="fl">Gleichstand am Loch</label>
        <div class="seg">
          <button data-seg="carry:0" class="${!S.cfg.carry?"on":""}">Push (0 Pkt)</button>
          <button data-seg="carry:1" class="${S.cfg.carry?"on":""}">Carry (nächstes Loch ×2)</button>
        </div>
      </div>`;
  }
  if(S.game==="vegas"){
    const names = S.players.map(p=>p.name);
    const teamPick = S.players.map((p,i)=>`
      <div class="vscore">
        <span class="vn">${escHtml(p.name||("Spieler "+(i+1)))}</span>
        <div class="seg" style="width:150px">
          <button data-team="${i}:0" class="${S.teams[i]===0?"on":""}">Team A</button>
          <button data-team="${i}:1" class="${S.teams[i]===1?"on":""}">Team B</button>
        </div>
      </div>`).join("");
    extra = `
      <div class="field"><label class="fl">Teams (2 vs 2)</label>${teamPick}
        <p class="hint" id="teamwarn"></p></div>
      <div class="field"><label class="fl">Regeln</label>
        <div class="seg" style="margin-bottom:10px">
          <button data-seg="flip:1" class="${S.cfg.flip?"on":""}">Birdie-Flip an</button>
          <button data-seg="flip:0" class="${!S.cfg.flip?"on":""}">aus</button>
        </div>
        <div class="small-cfg"><span>Score-Cap pro Spieler</span><input type="number" data-cfgv="cap" value="${S.cfg.cap}" min="6"></div>
        <p class="hint">Birdie-Flip dreht die Zahl des Gegnerteams hoch, wenn dein Team ein Birdie o. besser spielt. Cap verhindert dreistellige Zahlen bei Blow-ups.</p>
      </div>`;
  }
  if(S.game==="aggregat"){
    const teamPick = S.players.map((p,i)=>`
      <div class="vscore">
        <span class="vn">${escHtml(p.name||("Spieler "+(i+1)))}</span>
        <div class="seg" style="width:150px">
          <button data-team="${i}:0" class="${S.teams[i]===0?"on":""}">Team A</button>
          <button data-team="${i}:1" class="${S.teams[i]===1?"on":""}">Team B</button>
        </div>
      </div>`).join("");
    extra = `
      <div class="field"><label class="fl">Teams (2 vs 2)</label>${teamPick}
        <p class="hint" id="teamwarn"></p></div>
      <div class="field"><label class="fl">Zusatzregel</label>
        <div class="seg">
          <button data-seg="birdieDouble:1" class="${S.cfg.birdieDouble?"on":""}">Birdie zählt doppelt</button>
          <button data-seg="birdieDouble:0" class="${!S.cfg.birdieDouble?"on":""}">aus</button>
        </div>
        <p class="hint">Gewinnt ein Team einen Punkt an einem Loch, an dem es ein Birdie (o. besser) gespielt hat, zählt dieser Punkt doppelt. Beide Wertungen doppeln unabhängig.</p>
      </div>`;
  }
  return `${header(g.name,"Einstellungen",{back:"setup"})}
    <main>
      <div class="panel">
        <div class="field"><label class="fl">Löcher</label>
          <div class="seg">
            <button data-seg="holes:9" class="${S.holes===9?"on":""}">9 Löcher</button>
            <button data-seg="holes:18" class="${S.holes===18?"on":""}">18 Löcher</button>
          </div>
        </div>
        <div class="field"><label class="fl">Einsatz je Punkt (€ – optional, für Abrechnung)</label>
          <input type="number" data-cfgv="stake" value="${S.stake||""}" min="0" step="0.1" placeholder="z. B. 0,50">
        </div>
        <div class="divider"></div>
        ${extra}
      </div>
    </main>
    ${bar(`<button class="btn primary" data-start>Runde starten ›</button>`)}`;
}

/* --- Leaderboard-Berechnung --- */
function totals(){
  const t = S.players.map(()=>0);
  if(S.game==="bbb"){
    Object.values(S.results).forEach(r=>{
      ["bingo","bango","bongo"].forEach(k=>{ if(r[k]!=null) t[r[k]]+=S.cfg.pt; });
    });
  } else if(S.game==="wolf"){
    Object.values(S.results).forEach(r=>{ if(r.pts) r.pts.forEach((v,i)=>t[i]+=v); });
  } else if(S.game==="vegas"||S.game==="aggregat"){
    // Team-Punkte, dann auf Spieler verteilt
    const team=[0,0];
    Object.values(S.results).forEach(r=>{ if(r.tpts){ team[0]+=r.tpts[0]; team[1]+=r.tpts[1]; } });
    S.players.forEach((p,i)=>{ t[i]=team[S.teams[i]]; });
  } else if(S.game==="skins"){
    return skinsState().per;
  }
  return t;
}
function miniBoard(){
  const t = totals();
  const max = Math.max(...t, 0);
  const order = S.players.map((p,i)=>({p,i})).sort((a,b)=>t[b.i]-t[a.i]);
  const chips = order.map(({p,i})=>`
    <div class="chip ${t[i]===max&&max>0?"lead":""}">
      <div class="cn">${escHtml(p.name||("Sp."+(i+1)))}</div>
      <div class="cp">${fmtPts(t[i])}</div>
    </div>`).join("");
  return `<div class="mini">${chips}</div>`;
}

function playScreen(){
  const g = GAMES[S.game];
  const h = S.currentHole;
  const mini = miniBoard();
  let body="";
  if(S.game==="bbb")   body=bbbHole(h);
  if(S.game==="wolf")  body=wolfHole(h);
  if(S.game==="vegas") body=vegasHole(h);
  if(S.game==="aggregat") body=aggregatHole(h);
  if(S.game==="skins") body=skinsHole(h);
  const last = h>=S.holes;
  const navHtml = `<div class="holenav">
      <button class="btn ghost" data-hole="-1" ${h<=1?"disabled":""}>‹</button>
      <span class="cur">Loch ${h}/${S.holes}</span>
      <button class="btn ghost" data-hole="1" ${last?"disabled":""}>›</button>
    </div>`;
  const cta = last
    ? `<button class="btn primary" data-summary>Abrechnung ›</button>`
    : `<button class="btn primary" data-next>Loch abschließen ›</button>`;
  return `${header(g.name, null, {back:"config", mini})}
    <main>${body}</main>

}

/* --- BBB Loch --- */
function bbbHole(h){
  const r = S.results[h] || {};
  const line = (key,label,sub)=>{
    const picks = S.players.map((p,i)=>`
      <button class="pick ${r[key]===i?"on":""}" data-bbb="${key}:${i}">${escHtml(p.name||("Sp."+(i+1)))}</button>`).join("");

/* --- Wolf Loch --- */
function wolfOrder(){
  if(!S.order){ S.order = S.players.map((_,i)=>i); persist(); }
  return S.order;
}
function wolfAt(h){ const o=wolfOrder(); return o[(h-1)%o.length]; }
function wolfHole(h){
  const order = wolfOrder();
  const wolf = wolfAt(h);
  const r = S.results[h] || {mode:null, partner:null, won:null};
  const others = S.players.map((p,i)=>i).filter(i=>i!==wolf);
  const partnerBtns = others.map(i=>`
    <button class="pick ${r.mode==="partner"&&r.partner===i?"on":""}" data-wolf="partner:${i}">🤝 ${escHtml(S.players[i].name||("Sp."+(i+1)))}</button>`).join("");
  const loneN = S.players.length-1;
  let outcome="";
  if(r.mode){
    const teamLabel = r.mode==="partner"
      ? `${nm(wolf)} + ${nm(r.partner)}`
      : `${nm(wolf)} (allein)`;
    outcome = `<div class="field" style="margin-top:14px">
      <label class="fl">Wer hat das Loch gewonnen?</label>
      <div class="grid">
        <button class="pick ${r.won==="wolf"?"on":""}" data-wolf="won:wolf">${escHtml(teamLabel)}</button>
        <button class="pick ${r.won==="others"?"on flag":""}" data-wolf="won:others">Der Rest</button>
        <button class="pick muted wide ${r.won==="tie"?"on gold":""}" data-wolf="won:tie">Unentschieden ${S.cfg.carry?"(Carry)":"(Push)"}</button>
      </div>
    </div>`;
  }
  return `<div class="panel">
    <div class="holebar"><span class="holetag">Loch ${h}</span><span class="badge tag-wolf">🐺 Wolf: ${escHtml(nm(wolf))}</span></div>
    <div class="field" style="margin-top:6px">
      <label class="fl">${escHtml(nm(wolf))} entscheidet</label>
      <div class="grid">
        ${partnerBtns}
        <button class="pick gold ${r.mode==="lone"?"on gold":""} wide" data-wolf="mode:lone">🐺 Lone Wolf – allein gegen ${loneN}</button>
        <button class="pick ${r.mode==="blind"?"on flag":""} wide" data-wolf="mode:blind">🙈 Blind Lone Wolf (×${S.cfg.blindMult})</button>
      </div>
    </div>
    ${outcome}
    <p class="hint">Reihenfolge = Wolf-Rotation: ${order.map(i=>escHtml(nm(i))).join(" → ")} → …</p>
  </div>`;
}
function wolfComputePts(h){
  const r = S.results[h]; if(!r||!r.mode||!r.won) return null;
  const n = S.players.length, wolf = wolfAt(h);
  const pts = S.players.map(()=>0);
  const loneWin = (S.cfg.loneWin!=null && S.cfg.loneWin!=="") ? Number(S.cfg.loneWin) : (n-1);
  const others = S.players.map((_,i)=>i).filter(i=>i!==wolf && !(r.mode==="partner"&&i===r.partner));
  let mult = (r.carryMult||1);
  if(r.won==="tie"){ return {pts, carry:S.cfg.carry}; }
  if(r.mode==="partner"){
    if(r.won==="wolf"){ pts[wolf]+=S.cfg.partnerWin*mult; pts[r.partner]+=S.cfg.partnerWin*mult; }
    else { others.forEach(i=>pts[i]+=S.cfg.partnerWin*mult); }
  } else { // lone or blind
    const bm = r.mode==="blind" ? Number(S.cfg.blindMult) : 1;
    if(r.won==="wolf"){ pts[wolf]+= loneWin*bm*mult; }
    else { others.forEach(i=>pts[i]+=Number(S.cfg.loneLoss)*bm*mult); }
  }
  return {pts, carry:false};
}

/* --- Vegas Loch --- */
function vegasHole(h){
  const r = S.results[h] || (S.results[h] = {scores:S.players.map(()=>"")});
  const par = (r.par!=null?r.par:S.par);
  if(!r.prefilled){ S.players.forEach((_,i)=>{ if(r.scores[i]===""||r.scores[i]==null) r.scores[i]=par; }); r.prefilled=true; persist(); }
  const teamRows = [0,1].map(tm=>{
    const idx = S.players.map((_,i)=>i).filter(i=>S.teams[i]===tm);
    const rows = idx.map(i=>scoreStepper(i,"data-vstep",r.scores[i])).join("");
    return `<div class="vteam"><h4>Team ${tm===0?"A":"B"}</h4>${rows}</div>`;
  }).join("");
  const calc = vegasCompute(h, r, par);
  const resBox = calc ? `<div class="vresult">
      <span>Team A <b class="big">${calc.numA}</b>${calc.flipA?` <span class="flip-note">↑geflippt</span>`:""}</span>
      <span>Team B <b class="big">${calc.numB}</b>${calc.flipB?` <span class="flip-note">↑geflippt</span>`:""}</span>
    </div>
    <div class="vresult" style="background:var(--turf-soft)">
      <span>${calc.diff===0?"Unentschieden":"Team "+(calc.winner===0?"A":"B")+" gewinnt"}</span>
      <b class="big">${calc.diff>0?"+"+calc.diff:"0"} Pkt</b>
    </div>` : `<p class="hint">Alle vier Schläge eingeben für die Berechnung.</p>`;
  return `<div class="panel">
    <div class="holebar"><span class="holetag">Loch ${h}</span>${parStepper(par,"data-vpar")}</div>
    ${teamRows}
    ${resBox}
  </div>`;
}
function vegasCompute(h, r, par){
  const sc = (r&&r.scores)||[];
  if(S.players.some((_,i)=>sc[i]==="" || sc[i]==null)) return null;
  const cap = Number(S.cfg.cap)||9;
  const teamScores = [[],[]];
  S.players.forEach((_,i)=>{ teamScores[S.teams[i]].push(Math.min(Number(sc[i]),cap)); });
  const birdie = [
    teamScores[0].some(s=>s<par),
    teamScores[1].some(s=>s<par)
  ];
  const mk = (arr,flip)=>{
    const [a,b] = arr.slice().sort((x,y)=>x-y);
    return flip ? Number(""+Math.max(a,b)+Math.min(a,b)) : Number(""+Math.min(a,b)+Math.max(a,b));
  };
  const flipA = S.cfg.flip && birdie[1]; // Gegner (B) hat Birdie -> A wird geflippt
  const flipB = S.cfg.flip && birdie[0];
  const numA = mk(teamScores[0], flipA);
  const numB = mk(teamScores[1], flipB);
  const diff = Math.abs(numA-numB);
  const winner = numA===numB ? -1 : (numA<numB?0:1);
  return {numA,numB,diff,winner,flipA,flipB};
}

/* --- Aggregat Loch --- */
function aggregatHole(h){
  const r = S.results[h] || (S.results[h] = {scores:S.players.map(()=>"")});
  const par = (r.par!=null?r.par:S.par);
  if(!r.prefilled){ S.players.forEach((_,i)=>{ if(r.scores[i]===""||r.scores[i]==null) r.scores[i]=par; }); r.prefilled=true; persist(); }
  const teamRows = [0,1].map(tm=>{
    const idx = S.players.map((_,i)=>i).filter(i=>S.teams[i]===tm);
    const rows = idx.map(i=>scoreStepper(i,"data-astep",r.scores[i])).join("");
    return `<div class="vteam"><h4>Team ${tm===0?"A":"B"}</h4>${rows}</div>`;
  }).join("");
  const calc = aggregatCompute(h,r,par);
  let resBox = `<p class="hint">Alle vier Schläge eingeben für die Berechnung.</p>`;
  if(calc){
    const teamCell = (win,dbl)=> win<0
      ? `<span class="par">geteilt</span>`
      : `<b class="big">Team ${win===0?"A":"B"}${dbl?` <span class="flip-note">×2</span>`:""}</b>`;
    resBox = `
      <div class="vresult"><span>Bester Einzelscore (${calc.bestScore}${calc.bestBirdie?" · Birdie":""})</span>${teamCell(calc.indivWin,calc.indivDouble)}</div>
      <div class="vresult"><span>Team-Summe (A ${calc.sumA} : ${calc.sumB} B)</span>${teamCell(calc.sumWin,calc.sumDouble)}</div>
      <div class="vresult" style="background:var(--turf-soft)"><span>Punkte dieses Loch</span><b class="big">A ${calc.tpts[0]} : ${calc.tpts[1]} B</b></div>`;
  }
  return `<div class="panel">
    <div class="holebar"><span class="holetag">Loch ${h}</span>${parStepper(par,"data-apar")}</div>
    ${teamRows}
    ${resBox}
  </div>`;
}
function aggregatCompute(h,r,par){
  const sc=(r&&r.scores)||[];
  if(S.players.some((_,i)=>sc[i]===""||sc[i]==null)) return null;
  const vals = S.players.map((_,i)=>Number(sc[i]));
  const sums=[0,0]; S.players.forEach((_,i)=>{ sums[S.teams[i]]+=vals[i]; });
  const birdie=[false,false]; S.players.forEach((_,i)=>{ if(vals[i]<par) birdie[S.teams[i]]=true; });
  const best=Math.min(...vals);
  const bestTeams=new Set(S.players.map((_,i)=>i).filter(i=>vals[i]===best).map(i=>S.teams[i]));
  const indivWin = bestTeams.size===1 ? [...bestTeams][0] : -1;
  const sumWin = sums[0]===sums[1] ? -1 : (sums[0]<sums[1]?0:1);
  const dbl = !!S.cfg.birdieDouble;
  const indivDouble = dbl && indivWin>=0 && birdie[indivWin];
  const sumDouble   = dbl && sumWin>=0   && birdie[sumWin];
  const tpts=[0,0];
  if(indivWin>=0) tpts[indivWin]+= indivDouble?2:1;
  if(sumWin>=0)   tpts[sumWin]  += sumDouble?2:1;
  return {sumA:sums[0], sumB:sums[1], bestScore:best, bestBirdie:best<par, indivWin, sumWin, indivDouble, sumDouble, tpts};
}
function readAggregatScores(h){
  const r=S.results[h]||(S.results[h]={scores:S.players.map(()=>"")});
  document.querySelectorAll("[data-agg]").forEach(inp=>{ const i=+inp.dataset.agg; r.scores[i]=inp.value===""?"":Number(inp.value); });
}
function finalizeAggregat(h){
  const r=S.results[h]; if(!r) return;
  const par=(r.par!=null?r.par:S.par);
  const c=aggregatCompute(h,r,par); r.tpts = c? c.tpts : [0,0]; persist();
}

/* --- Skins (carry-basiert, sequenzielle Neuberechnung) --- */
function skinsState(){
  const per = S.players.map(()=>0);
  const holeInfo = {};
  let carried = 0;
  for(let h=1; h<=S.holes; h++){
    const r = S.results[h];
    const complete = r && r.scores && S.players.every((_,i)=>r.scores[i]!=="" && r.scores[i]!=null);
    const pot = carried + 1;
    if(!complete){ holeInfo[h] = {pot, winner:null, resolved:false, tie:false}; continue; }
    const vals = S.players.map((_,i)=>Number(r.scores[i]));
    const best = Math.min(...vals);
    const low = S.players.map((_,i)=>i).filter(i=>vals[i]===best);
    if(low.length===1){ per[low[0]] += pot; holeInfo[h] = {pot, winner:low[0], resolved:true, tie:false}; carried = 0; }
    else { holeInfo[h] = {pot, winner:null, resolved:true, tie:true}; carried = pot; }
  }
  return {per, holeInfo, carried};
}
function skinsHole(h){
  const r = S.results[h] || {scores:S.players.map(()=>"")};
  const st = skinsState();
  const info = st.holeInfo[h] || {pot:1, winner:null, resolved:false, tie:false};
  const rows = S.players.map((p,i)=>scoreStepper(i,"data-sstep",r.scores[i])).join("");
  let res;
  const sk = n=>`${n} Skin${n>1?"s":""}`;
  if(!info.resolved){
    res = `<div class="vresult"><span>Wert dieses Loch</span><b class="big">${sk(info.pot)}</b></div>
           <p class="hint">Alle Scores eingeben, dann steht der Loch-Gewinner.</p>`;
  } else if(info.winner!=null){
    res = `<div class="vresult" style="background:var(--turf-soft)"><span>🪙 ${escHtml(nm(info.winner))} gewinnt</span><b class="big">+${sk(info.pot)}</b></div>`;
  } else {
    res = `<div class="vresult"><span>Gleichstand – Carry</span><b class="big">${sk(info.pot)} → Loch ${h+1}</b></div>`;
  }
  const potBadge = (info.pot>1) ? `<span class="badge" style="background:var(--lime-soft);color:var(--lime-dark)">Pot: ${sk(info.pot)}</span>` : "";
  return `<div class="panel">
    <div class="holebar"><span class="holetag">Loch ${h}</span>${potBadge}</div>
    ${rows}
    ${res}
  </div>`;
}
function readSkinsScores(h){
  const r=S.results[h]||(S.results[h]={scores:S.players.map(()=>"")});
  document.querySelectorAll("[data-skin]").forEach(inp=>{ const i=+inp.dataset.skin; r.scores[i]=inp.value===""?"":Number(inp.value); });
}

function summaryScreen(){
  const t = totals();
  const ptLabel = S.game==="skins" ? "Skins" : "Punkte";
  const order = S.players.map((p,i)=>({p,i})).sort((a,b)=>t[b.i]-t[a.i]);
  const rows = order.map(({p,i},rank)=>`
    <tr class="${rank===0?"win":""}">
      <td><span class="rk">${rank+1}</span>${escHtml(p.name||("Spieler "+(i+1)))}</td>
      <td class="num">${fmtPts(t[i])}</td>
      ${S.stake?`<td class="num">${money(t[i]*S.stake - avg(t)*S.stake)}</td>`:""}
    </tr>`).join("");
  let voided="";
  if(S.game==="skins"){ const c=skinsState().carried; if(c>0) voided=`<p class="hint">${c} Skin${c>1?"s":""} nicht gewonnen (Gleichstand am letzten Loch) – verfallen.</p>`; }
  let settle="";
  if(S.stake){
    settle = `<div class="panel"><div class="eyebrow">Abrechnung · ${money(S.stake)}/${S.game==="skins"?"Skin":"Punkt"}</div>
      <div class="settle">${settleUp(t)}</div>
      <p class="hint">Netto ggü. Durchschnitt: wer über dem Schnitt liegt, bekommt – wer drunter liegt, zahlt.</p></div>`;
  }
  return `${header(GAMES[S.game].name,"Endstand",{back:"play"})}
    <main>
      <div class="panel">
        <table class="board">
          <thead><tr><th>Spieler</th><th style="text-align:right">${ptLabel}</th>${S.stake?`<th style="text-align:right">Netto</th>`:""}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
        ${voided}
      </div>
      ${settle}
    </main>
    ${bar(`<button class="btn ghost" data-back="play" style="flex:1">‹ Löcher</button><button class="btn turf" data-newround>Neue Runde</button>`)}`;
}
function avg(t){ return t.reduce((a,b)=>a+b,0)/t.length; }
function settleUp(t){
  const a = avg(t);
  return S.players.map((p,i)=>{
    const net = (t[i]-a)*S.stake;
    const sign = net>=0?"bekommt":"zahlt";
    return `<div><span>${escHtml(p.name||("Sp."+(i+1)))}</span><span class="amt" style="color:${net>=0?'var(--turf-dark)':'var(--flag-dark)'}">${sign} ${money(Math.abs(net))}</span></div>`;
  }).join("");
}

/* ============================ Helpers ============================ */
function bar(inner){ return `<div class="bar"><div class="bar-inner">${inner}</div></div>`; }
function scoreStepper(i, attr, val){
  const empty = (val===""||val==null);
  return `<div class="scorerow">
    <span class="vn">${escHtml(nm(i))}</span>
    <div class="scstep">
      <button ${attr}="${i}:-1" aria-label="minus">–</button>
      <span class="scval ${empty?"empty":""}">${empty?"–":val}</span>
      <button ${attr}="${i}:1" aria-label="plus">+</button>
    </div>
  </div>`;
}
function parStepper(par, attr){
  return `<div class="parstep">
    <span class="parlbl">Par</span>
    <button ${attr}="-1" aria-label="Par minus">–</button>
    <span class="parval">${par}</span>
    <button ${attr}="1" aria-label="Par plus">+</button>
  </div>`;
}
function nm(i){ return S.players[i]?.name || ("Spieler "+(i+1)); }
function fmt(n){ return (n>0?"+":"")+n; }
function fmtPts(n){ return S.game==="skins" ? String(n) : (n>0?"+":"")+n; }
function money(n){ return (n<0?"-":"")+"€"+Math.abs(n).toFixed(2).replace(".",","); }
function escHtml(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function escAttr(s){ return escHtml(s).replace(/"/g,"&quot;"); }

/* ============================ Event wiring ============================ */
function readNames(){ document.querySelectorAll("[data-name]").forEach(inp=>{ S.players[+inp.dataset.name].name = inp.value.trim(); }); }
function readVegasScores(h){
  const r = S.results[h] || (S.results[h]={scores:S.players.map(()=>"")});
  document.querySelectorAll("[data-vegas]").forEach(inp=>{ const i=+inp.dataset.vegas; r.scores[i] = inp.value===""?"":Number(inp.value); });
}

function wire(){
  const app = document.getElementById("app");

  app.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>{ S=freshState(b.dataset.game); persist(); render(); });
  const rs = app.querySelector("[data-resume]"); if(rs) rs.onclick=()=>{ S=store.get(SKEY); render(); };
  const cs = app.querySelector("[data-clearsaved]"); if(cs) cs.onclick=()=>{ store.del(SKEY); render(homeScreen(null)); };

  app.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{
    const dest=b.dataset.back;
    if(S && S.game && ["setup","config","play"].includes(dest)){ if(S.screen==="setup") readNames(); go(dest); }
    else { render(homeScreen(store.get(SKEY))); }
  });

  // setup
  app.querySelectorAll("[data-pcount]").forEach(b=>b.onclick=()=>{
    readNames(); const d=+b.dataset.pcount, g=GAMES[S.game];
    const n=Math.min(g.max,Math.max(g.min,S.players.length+d));
    while(S.players.length<n) S.players.push({name:""});
    while(S.players.length>n) S.players.pop();
    persist(); render();
  });
  const toCfg = app.querySelector('[data-to="config"]');
  if(toCfg) toCfg.onclick=()=>{ readNames(); store.set(NKEY, S.players.map(p=>p.name)); go("config"); };

  // config toggles
  app.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{
    const [k,v]=b.dataset.seg.split(":");
    if(k==="holes") S.holes=+v;
    else if(k==="carry") S.cfg.carry=(v==="1");
    else if(k==="flip") S.cfg.flip=(v==="1");
    else if(k==="birdieDouble") S.cfg.birdieDouble=(v==="1");
    persist(); render();
  });
  app.querySelectorAll("[data-cfg]").forEach(b=>b.onclick=()=>{
    const [k,d]=b.dataset.cfg.split(":"); S.cfg[k]=Math.max(1,(S.cfg[k]||1)+Number(d)); persist(); render();
  });
  app.querySelectorAll("[data-cfgv]").forEach(inp=>inp.onchange=()=>{
    const k=inp.dataset.cfgv, val=inp.value===""?"":Number(inp.value);
    if(k==="stake") S.stake=val||0; else S.cfg[k]=val;
    persist();
  });
  app.querySelectorAll("[data-team]").forEach(b=>b.onclick=()=>{
    const [i,tm]=b.dataset.team.split(":").map(Number); S.teams[i]=tm; persist(); render();
    const idx=[0,1].map(t=>S.teams.filter(x=>x===t).length);
    const w=document.getElementById("teamwarn"); if(w) w.textContent = (idx[0]!==2||idx[1]!==2)?"⚠ Beide Teams brauchen genau 2 Spieler.":"";
  });
  const start = app.querySelector("[data-start]");
  if(start) start.onclick=()=>{
    if(S.game==="vegas"||S.game==="aggregat"){ const c=[0,1].map(t=>S.teams.filter(x=>x===t).length); if(c[0]!==2||c[1]!==2){ alert("Beide Teams brauchen genau 2 Spieler."); return; } }
    S.currentHole=1; go("play");
  };

  // play – hole nav
  app.querySelectorAll("[data-hole]").forEach(b=>b.onclick=()=>{
    finalizeCurrent();
    S.currentHole=Math.min(S.holes,Math.max(1,S.currentHole+Number(b.dataset.hole))); persist(); render();
  });
  const next=app.querySelector("[data-next]");
  if(next) next.onclick=()=>{
    finalizeCurrent();
    S.currentHole=Math.min(S.holes,S.currentHole+1); persist(); render();
  };
  const sm=app.querySelector("[data-summary]");
  if(sm) sm.onclick=()=>{ finalizeCurrent(); go("summary"); };

  // BBB picks
  app.querySelectorAll("[data-bbb]").forEach(b=>b.onclick=()=>{
    const [key,val]=b.dataset.bbb.split(":"); const h=S.currentHole;
    const r=S.results[h]||(S.results[h]={}); r[key]= val==="null"?null:Number(val); persist(); render();
  });

  // Wolf picks
  app.querySelectorAll("[data-wolf]").forEach(b=>b.onclick=()=>{
    const [k,v]=b.dataset.wolf.split(":"); const h=S.currentHole;
    const r=S.results[h]||(S.results[h]={mode:null,partner:null,won:null});
    if(k==="partner"){ r.mode="partner"; r.partner=Number(v); }
    else if(k==="mode"){ r.mode=v; r.partner=null; }
    else if(k==="won"){ r.won=v; }
    persist(); render();
  });

  // Par-Stepper: neue Par übernehmen und unveränderte Vorbelegungen mitziehen
  const parAdjust = (attr)=> app.querySelectorAll(`[${attr}]`).forEach(b=>b.onclick=()=>{
    const h=S.currentHole;
    const r=S.results[h]||(S.results[h]={scores:S.players.map(()=>"")});
    const oldPar=(r.par!=null?r.par:S.par);
    const newPar=Math.min(6,Math.max(3,oldPar+Number(b.getAttribute(attr))));
    r.par=newPar; r.prefilled=true;
    S.players.forEach((_,i)=>{ if(r.scores[i]===""||r.scores[i]==null||Number(r.scores[i])===oldPar) r.scores[i]=newPar; });
    persist(); render();
  });
  parAdjust("data-vpar"); parAdjust("data-apar");

  // Score-Stepper (Vegas/Aggregat): leer -> Par als Basis, sonst ±1
  const scoreAdjust = (attr)=> app.querySelectorAll(`[${attr}]`).forEach(b=>b.onclick=()=>{
    const [i,d]=b.getAttribute(attr).split(":").map(Number); const h=S.currentHole;
    const r=S.results[h]||(S.results[h]={scores:S.players.map(()=>"")});
    const par=(r.par!=null?r.par:S.par);
    let cur=(r.scores[i]===""||r.scores[i]==null)?par:Number(r.scores[i]);
    r.scores[i]=Math.min(15,Math.max(1,cur+d)); persist(); render();
  });
  scoreAdjust("data-vstep"); scoreAdjust("data-astep");

  // Skins-Stepper: leer -> erster Tap setzt 4, dann ±1
  app.querySelectorAll("[data-sstep]").forEach(b=>b.onclick=()=>{
    const [i,d]=b.dataset.sstep.split(":").map(Number); const h=S.currentHole;
    const r=S.results[h]||(S.results[h]={scores:S.players.map(()=>"")});
    if(r.scores[i]===""||r.scores[i]==null){ r.scores[i]=4; }
    else { r.scores[i]=Math.min(15,Math.max(1,Number(r.scores[i])+d)); }
    persist(); render();
  });

  const nr=app.querySelector("[data-newround]");
  if(nr) nr.onclick=()=>{ store.del(SKEY); S=null; render(homeScreen(null)); };
}

function finalizeWolf(h){ const c=wolfComputePts(h); if(!c) return; const r=S.results[h]; r.pts=c.pts;
  // Carry: wenn Push mit Carry-Regel, nächstes Loch ×2
  if(S.cfg.carry && r.won==="tie"){ const nh=S.results[h+1]||(S.results[h+1]={mode:null,partner:null,won:null}); nh.carryMult=(r.carryMult||1)+1; }
  persist();
}
function finalizeVegas(h){ const r=S.results[h]; if(!r) return; const par=(r.par!=null?r.par:S.par);
  const c=vegasCompute(h,r,par); if(!c){ r.tpts=[0,0]; return; }
  r.tpts=[0,0]; if(c.winner===0) r.tpts[0]=c.diff; else if(c.winner===1) r.tpts[1]=c.diff; persist();
}
function finalizeCurrent(){
  const h=S.currentHole;
  if(S.game==="vegas"){ readVegasScores(h); finalizeVegas(h); }
  else if(S.game==="aggregat"){ readAggregatScores(h); finalizeAggregat(h); }
  else if(S.game==="skins"){ readSkinsScores(h); }
  else if(S.game==="wolf"){ finalizeWolf(h); }
  // bbb: Totals werden live aus results berechnet, kein Finalize nötig
}

boot();

// PWA: Service Worker registrieren (nur über https / localhost aktiv)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
